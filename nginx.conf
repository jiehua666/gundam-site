# GUNDAM SITE - Nginx Configuration Example
# Save as /etc/nginx/sites-available/gundam-site.conf
# Then symlink: ln -s /etc/nginx/sites-available/gundam-site.conf /etc/nginx/sites-enabled/

upstream gundam_site {
    server 127.0.0.1:3001;
    keepalive 64;
}

server {
    listen 80;
    server_name gundam.site www.gundam.site;

    # Redirect HTTP to HTTPS (uncomment when SSL is configured)
    # return 301 https://$server_name$request_uri;

    # For SSL, use the following block instead:
    # listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    # ssl_certificate /path/to/fullchain.pem;
    # ssl_certificate_key /path/to/privkey.pem;
    # ssl_session_timeout 1d;
    # ssl_session_cache shared:SSL:50m;
    # ssl_session_tickets off;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    # ssl_prefer_server_ciphers off;
    # add_header Strict-Transport-Security "max-age=63072000" always;

    # Security headers
    add_header X-DNS-Prefetch-Control "on" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml application/wasm;

    # Static files caching
    location /_next/static/ {
        proxy_pass http://gundam_site;
        proxy_cache_valid 200 31536000s;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public uploads and banners
    location /banners/ {
        proxy_pass http://gundam_site;
        proxy_cache_valid 200 86400s;
        add_header Cache-Control "public, max-age=86400";
    }

    # API routes - no caching
    location /api/ {
        proxy_pass http://gundam_site;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Dynamic pages
    location / {
        proxy_pass http://gundam_site;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://gundam_site;
        access_log off;
    }

    # Max upload size (for avatar uploads, etc.)
    client_max_body_size 10M;
}

